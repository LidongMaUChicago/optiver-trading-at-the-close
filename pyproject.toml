[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optiver-close-research"
version = "0.1.0"
description = "Causal market microstructure features and reproducible closing-auction forecasting"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<2.3", "pandas>=2.2,<3", "scikit-learn>=1.7,<1.8", "xgboost>=3.0,<3.1", "joblib>=1.3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
neural = ["torch>=2.8,<2.9"]
dev = ["pytest>=8,<10"]

[project.scripts]
optiver-research = "optiver_close.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

